<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#07090e" stroke="#1e293b" stroke-width="2"/>
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Tech Diamond Framing -->
  <polygon points="32,8 56,32 32,56 8,32" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  <circle cx="32" cy="8" r="1.5" fill="#38bdf8"/>
  <circle cx="56" cy="32" r="1.5" fill="#38bdf8"/>
  <circle cx="32" cy="56" r="1.5" fill="#38bdf8"/>
  <circle cx="8" cy="32" r="1.5" fill="#38bdf8"/>
  
  <!-- Central Stylized K Monogram -->
  <path d="M 22 18 L 22 46 M 22 32 L 40 18 M 28 27 L 42 46" fill="none" stroke="url(#cyberGrad)" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter" filter="url(#glow)"/>
</svg>
