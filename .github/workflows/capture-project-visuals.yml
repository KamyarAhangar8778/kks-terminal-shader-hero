name: Capture live project visuals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: write

concurrency:
  group: capture-project-visuals
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser automation
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Capture deployed experience
        run: |
          mkdir -p docs/media ./tmp/kks-frames
          cat > ./capture.mjs <<'EOF'
          import { chromium } from 'playwright';

          const url = 'https://kamyarahangar8778.github.io/kks-terminal-shader-hero/';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1
            });

            await page.goto(url, { waitUntil: 'networkidle', timeout: 90000 });
            await page.waitForTimeout(3500);
            await page.screenshot({ path: 'docs/media/hero-desktop.png', fullPage: false });

            const pageHeight = await page.evaluate(() => document.documentElement.scrollHeight);
            const viewportHeight = 1000;
            const maxScroll = Math.max(0, pageHeight - viewportHeight);
            const stops = [...new Set([0, maxScroll * 0.22, maxScroll * 0.48, maxScroll * 0.72, maxScroll].map(v => Math.round(v)))];

            let index = 0;
            for (const y of stops) {
              await page.evaluate(y => window.scrollTo({ top: y, behavior: 'instant' }), y);
              await page.waitForTimeout(900);
              await page.screenshot({ path: `./tmp/kks-frames/frame-${String(index++).padStart(3, '0')}.png` });
            }
          } finally {
            await browser.close();
          }
          EOF
          trap 'rm -f ./capture.mjs' EXIT
          node ./capture.mjs
          test -s docs/media/hero-desktop.png
          test -s ./tmp/kks-frames/frame-000.png
          ffmpeg -y -framerate 1.2 -i ./tmp/kks-frames/frame-%03d.png -vf "fps=1.2,scale=1000:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=96[p];[s1][p]paletteuse=dither=bayer:bayer_scale=3" -loop 0 docs/media/project-tour.gif
          test -s docs/media/project-tour.gif

      - name: Commit refreshed visuals
        run: |
          git add docs/media/hero-desktop.png docs/media/project-tour.gif
          if git diff --cached --quiet; then
            echo "Captured visuals are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh live project visuals"
          git push
