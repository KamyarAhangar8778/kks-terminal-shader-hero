name: Capture live project visuals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: write

concurrency:
  group: capture-project-visuals
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser automation
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Capture deployed experience
        run: |
          mkdir -p docs/media ./tmp/kks-video
          cat > ./capture.mjs <<'EOF'
          import { chromium } from 'playwright';

          const url = 'https://kamyarahangar8778.github.io/kks-terminal-shader-hero/';
          const browser = await chromium.launch({ headless: true });
          try {
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1,
              recordVideo: { dir: './tmp/kks-video', size: { width: 1440, height: 1000 } }
            });
            const page = await context.newPage();

            await page.goto(url, { waitUntil: 'networkidle', timeout: 90000 });
            await page.waitForTimeout(2500);
            await page.screenshot({ path: 'docs/media/hero-desktop.png', fullPage: false });

            const pageHeight = await page.evaluate(() => document.documentElement.scrollHeight);
            const viewportHeight = 1000;
            const maxScroll = Math.max(0, pageHeight - viewportHeight);

            // Capture one continuous down-scroll pass: shorter duration, consistent motion, fewer GIF frames.
            const step = 36;
            const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
            for (let y = 0; y <= maxScroll; y += step) {
              await page.evaluate(y => window.scrollTo({ top: y, behavior: 'instant' }), y);
              await delay(35);
            }
            await delay(350);
            const video = page.video();
            await context.close();
            await video.saveAs('./tmp/kks-video/page-tour.webm');
          } finally {
            await browser.close();
          }
          EOF
          trap 'rm -f ./capture.mjs' EXIT
          node ./capture.mjs
          test -s docs/media/hero-desktop.png
          test -s ./tmp/kks-video/page-tour.webm
          # First pass: balanced quality and size. Retry with smaller dimensions/fewer frames if needed.
          ffmpeg -y -i ./tmp/kks-video/page-tour.webm -vf "fps=10,scale=720:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=64:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=3:diff_mode=rectangle" -loop 0 docs/media/project-tour.gif
          GIF_SIZE=$(stat -c%s docs/media/project-tour.gif)
          echo "GIF size after first pass: $GIF_SIZE bytes"
          if [ "$GIF_SIZE" -gt 8000000 ]; then
            echo "GIF exceeds 8 MB; generating a smaller fallback."
            ffmpeg -y -i ./tmp/kks-video/page-tour.webm -vf "fps=8,scale=640:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=48:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=3:diff_mode=rectangle" -loop 0 docs/media/project-tour.gif
            GIF_SIZE=$(stat -c%s docs/media/project-tour.gif)
            echo "GIF size after fallback: $GIF_SIZE bytes"
          fi
          test -s docs/media/project-tour.gif
          if [ "$GIF_SIZE" -gt 8000000 ]; then
            echo "GIF still exceeds the 8 MB budget after fallback."
            exit 1
          fi

      - name: Commit refreshed visuals
        run: |
          git add docs/media/hero-desktop.png docs/media/project-tour.gif
          if git diff --cached --quiet; then
            echo "Captured visuals are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh live project visuals"
          git push
