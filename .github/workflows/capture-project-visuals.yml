name: Capture live project screenshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: write

concurrency:
  group: capture-project-visuals
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser automation
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture deployed screenshot
        run: |
          mkdir -p docs/media
          cat > ./capture.mjs <<'EOF'
          import { chromium } from 'playwright';

          const url = 'https://kamyarahangar8778.github.io/kks-terminal-shader-hero/';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1
            });
            await page.goto(url, { waitUntil: 'networkidle', timeout: 90000 });
            await page.waitForTimeout(2500);
            await page.screenshot({ path: 'docs/media/hero-desktop.png', fullPage: false });
          } finally {
            await browser.close();
          }
          EOF
          trap 'rm -f ./capture.mjs' EXIT
          node ./capture.mjs
          test -s docs/media/hero-desktop.png

      - name: Commit refreshed screenshot
        run: |
          git add docs/media/hero-desktop.png
          if git diff --cached --quiet; then
            echo "Screenshot is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh live project screenshot"
          git push
